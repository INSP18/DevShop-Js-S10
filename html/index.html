<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShop</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js"></script>
</head>
<body>
    <header>
        <nav>
            <img src="/images/logo.png" alt="logo du site" width="80" height="40">
            <ul>
                <li><a href="#Accueil">Accueil</a></li>
                <li><a href="#Product">Produits</a></li>
                <li><a href="#Category">Catégories</a></li>
                <input type="text" id="chercher-produits" placeholder="chercher produits...">
                <img src="" alt="panier">
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero-section">
            <h1>Découvrez nos <span>meilleurs</span> produits</h1>
            <p>Qualité, performance et design réunis.<br>Trouvez ce dont vous avez besoin</p>
            <button class="see-products" id="seeProducts">Voir les produits</button>
            <section class="warranty">
                <div class="warranty-child">
                    <img src="/images/paiement-securise.png" alt="secure paiement image" width="30" height="30">
                    <div class="warranty-description">
                        <h5>Paiement sécurisé<br></h5>
                        <p class="p-warranty">100% protégé</p>
                    </div>
                </div>

                <div class="warranty-child">
                    <img src="/images/livraison-rapide.png" alt="delivery image" width="30" height="30">
                    <div class="warranty-description">
                        <h5>Livraison rapide</h5>
                        <p class="p-warranty">Sous 48h</p>
                    </div>
                </div>

                <div class="warranty-child">
                    <img src="/images/boite-de-retour.png" alt="repaiement image" width="30" height="30">
                    <div class="warranty-description">
                        <h5>Retour gratuit</h5>
                        <p class="p-warranty">Sous 30 jours</p>
                    </div>
                </div>
            </section>
        </section>
        <section class="products" id="products-container">
            <h2>Nos produits</h2>
        </section>
    </main>
    <footer></footer>
</body>
</html>
